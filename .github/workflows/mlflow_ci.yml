name: MLflow CI and Docker Build

on:
  push:
    branches: [main]

jobs:
  run-mlflow-project:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MLProject

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas scikit-learn

      - name: Run MLflow Project (Retraining)
        run: |
          mlflow run . --env-manager=local

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Build and Push
        run: |
          echo "FROM python:3.9-slim" > Dockerfile
          echo "COPY . /app" >> Dockerfile
          echo "WORKDIR /app" >> Dockerfile
          echo "RUN pip install mlflow pandas scikit-learn" >> Dockerfile
          echo "CMD [\"python\", \"modelling.py\"]" >> Dockerfile

          docker build -t ${{ secrets.DOCKER_USERNAME }}/titanic-model:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/titanic-model:latest
